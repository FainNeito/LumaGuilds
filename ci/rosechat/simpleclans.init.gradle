// Build-only dependency substitution for official RoseChat.
// SimpleClans' canonical Maven endpoint can fail TLS negotiation; use the
// same 2.19.2 artifact from Modrinth without modifying RoseChat source.
allprojects {
    repositories {
        maven { url = uri('https://api.modrinth.com/maven') }
        // The Iridium repository is unrelated to these dynamic dependencies.
        // Its 502 responses must not prevent their own repositories resolving them.
        whenObjectAdded { repository ->
            if (repository.hasProperty('url') && repository.url?.host == 'nexus.iridiumdevelopment.net') {
                repository.content {
                    excludeGroup('io.papermc.paper')
                    excludeGroup('com.comphenix.protocol')
                }
            }
        }
    }
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('net.sacredlabyrinth.phaed.simpleclans:SimpleClans') using module('maven.modrinth:quLDfyDl:xlIV342T')
        }
    }
}
